# Add this to kitty.conf:
# include kitty_workspaces/kitty-workspaces.conf
# Also enable tab_bar.py.example as described in that file, then restart Kitty.

tab_title_template        "{custom}"
active_tab_title_template "{custom}"

# Track visits and enable workspace navigation:
watcher                   kitty_workspaces/watcher.py

## Optional settings
## Remove one leading # from each line to enable a section.
## For mappings, replace <...-shortcut> with a Kitty key combination of your choice.

## Workspace navigation

# map <attention-shortcut> kitten kitty_workspaces/kitten.py next-agent
# map <previous-workspace-shortcut> kitten kitty_workspaces/kitten.py previous-workspace

## Tabs
# active_tab_font_style    bold
## Reserve the sidebar to prevent reflow.
# tab_bar_min_tabs         1
# tab_bar_style            separator
# tab_separator            ""
# tab_switch_strategy      right
# tab_bar_edge             left
# tab_title_max_lines      2

## Window appearance
# active_border_color      #cdcecf
# draw_minimal_borders     no
# window_border_width      1pt
# window_margin_width      3

## Tab and split shortcuts

# map <rename-tab-shortcut> set_tab_title

# map <split-shortcut> launch --location=vsplit --cwd=current

## Window navigation
# map <left-shortcut> neighboring_window left
# map <down-shortcut> neighboring_window down
# map <up-shortcut> neighboring_window up
# map <right-shortcut> neighboring_window right

## vim-kitty-navigator integration
# map --when-focus-on var:IS_VIM=true <left-shortcut>
# map --when-focus-on var:IS_VIM=true <down-shortcut>
# map --when-focus-on var:IS_VIM=true <up-shortcut>
# map --when-focus-on var:IS_VIM=true <right-shortcut>
