name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install Kitty baseline and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 shellcheck shfmt
          curl -fsSL https://sw.kovidgoyal.net/kitty/installer.sh -o "$RUNNER_TEMP/install-kitty.sh"
          sh "$RUNNER_TEMP/install-kitty.sh" installer=version-0.50.0 launch=n dest="$RUNNER_TEMP/kitty"
          echo "$RUNNER_TEMP/kitty/kitty.app/bin" >> "$GITHUB_PATH"
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Markdown linter
        run: npm install --global markdownlint-cli2@0.23.3
      - name: Check formatting, lint, and tests
        run: |
          uv sync --locked
          just check
      - name: Graphical Kitty checks
        run: xvfb-run -a uv run --locked pytest -q --run-kitty-integration -m kitty_integration tests/integration
      - name: Build and verify source release
        run: |
          uv build --sdist
          uv run --locked python scripts/check_dist.py
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: uv run --locked python scripts/prepare_release.py "$RELEASE_TAG" "$RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "$RELEASE_TAG" --notes-file release/notes.md \
            release/*.tar.gz release/SHA256SUMS release/bootstrap.sh
