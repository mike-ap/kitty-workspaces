name: Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install Kitty baseline and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 shellcheck shfmt
          curl -fsSL https://sw.kovidgoyal.net/kitty/installer.sh -o "$RUNNER_TEMP/install-kitty.sh"
          sh "$RUNNER_TEMP/install-kitty.sh" installer=version-0.50.0 launch=n dest="$RUNNER_TEMP/kitty"
          echo "$RUNNER_TEMP/kitty/kitty.app/bin" >> "$GITHUB_PATH"
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          npm install --global markdownlint-cli2@0.23.3
      - name: Check formatting, lint, and tests
        run: |
          uv sync --locked
          just check
      - name: Report branch coverage
        run: just coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
      - name: Build source archive
        run: uv build --sdist
